name: voltmap
description: One App. Every EV Charger.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  go_router: ^16.2.0

  google_maps_flutter: ^2.12.3

  geolocator: ^14.0.2

  geocoding: ^4.0.0

  firebase_core: ^4.1.0

  firebase_auth: ^6.0.2

  cloud_firestore: ^6.0.1

  firebase_messaging: ^16.0.1

  dio: ^5.9.0

  freezed_annotation: ^3.1.0

  json_annotation: ^4.9.0

  flutter_svg: ^2.2.0

  cached_network_image: ^3.4.1

  lottie: ^3.3.1

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
